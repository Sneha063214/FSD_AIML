<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Profile Finder</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #a696ca;
            color: #540a72;
        }

        .container {
            max-width: 600px;
            margin: 60px auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        .search {
            display: flex;
            gap: 10px;
            margin: 30px 0;
        }

        input {
            flex: 1;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius:50%;
            background: #24292e;
            color: white;
            cursor: pointer;
            
        }

        button:hover {
            background: #000;
        }

        .card {
            background: pink;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            font-family:'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border:2px solid rgb(238, 3, 227);
        }

        .username {
            color: #666;
        }

        .bio {
            color: #444;
            margin: 20px 0;
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin: 25px 0;
        }

        .stat {
            display: flex;
            flex-direction: column;
        }

        .stat strong {
            font-size: 22px;
        }

        .stat span {
            color: #666;
            font-size: 14px;
        }

        .profile-link {
            display: inline-block;
            margin-top: 10px;
            padding: 10px 18px;
            background: #24292e;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        #message {
            text-align: center;
            margin: 20px 0;
            color: red;
        }

        #profile {
            display: none;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>GitHub Profile Finder</h1>

        <div class="search">
            <input
                type="text"
                id="usernameInput"
                placeholder="Enter GitHub username"
            >

            <button onclick="getProfile()">
                Search
            </button>
        </div>

        <p id="message"></p>

        <div id="profile" class="card">

            <img id="avatar" class="avatar" alt="GitHub Avatar">

            <h2 id="name"></h2>

            <p id="username" class="username"></p>

            <p id="bio" class="bio"></p>

            <div class="stats">

                <div class="stat">
                    <strong id="followers">0</strong>
                    <span>Followers</span>
                </div>

                <div class="stat">
                    <strong id="following">0</strong>
                    <span>Following</span>
                </div>

                <div class="stat">
                    <strong id="repos">0</strong>
                    <span>Repositories</span>
                </div>

            </div>

            <a
                id="profileLink"
                class="profile-link"
                target="_blank"
            >
                View GitHub Profile
            </a>

        </div>

    </div>


    <script>

        async function getProfile() {

            const username =
                document.getElementById("usernameInput").value.trim();

            const message =
                document.getElementById("message");

            const profile =
                document.getElementById("profile");


            // Check empty input
            if (username === "") {

                message.textContent =
                    "Please enter a GitHub username.";

                profile.style.display = "none";

                return;
            }


            message.textContent = "Loading...";


            try {

                const response = await fetch(
                    `https://api.github.com/users/${username}`
                );


                // User does not exist
                if (!response.ok) {

                    throw new Error(
                        "GitHub user not found."
                    );
                }


                const data = await response.json();


                // Display data

                document.getElementById("avatar").src =
                    data.avatar_url;

                document.getElementById("name").textContent =
                    data.name || data.login;

                document.getElementById("username").textContent =
                    "@" + data.login;

                document.getElementById("bio").textContent =
                    data.bio || "No bio available";

                document.getElementById("followers").textContent =
                    data.followers;

                document.getElementById("following").textContent =
                    data.following;

                document.getElementById("repos").textContent =
                    data.public_repos;

                document.getElementById("profileLink").href =
                    data.html_url;


                // Show profile

                profile.style.display = "block";

                message.textContent = "";

            }


            catch (error) {

                profile.style.display = "none";

                message.textContent =
                    error.message;

            }

        }


        // Allow pressing Enter instead of clicking Search

        document
            .getElementById("usernameInput")
            .addEventListener("keypress", function(event) {

                if (event.key === "Enter") {
                    getProfile();
                }

            });

    </script>

</body>
</html>
